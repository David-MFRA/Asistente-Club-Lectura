<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin · Club de Lectura</title>
    <style>
        :root{
            --bg1:#0f172a;
            --bg2:#1e293b;
            --card:rgba(255,255,255,0.12);
            --card-border:rgba(255,255,255,0.18);
            --text:#f8fafc;
            --muted:#cbd5e1;
            --primary:#6366f1;
            --primary-2:#8b5cf6;
            --danger:#ef4444;
            --shadow:0 20px 40px rgba(0,0,0,.25);
            --radius:22px;
        }

        *{
            box-sizing:border-box;
        }

        html,body{
            margin:0;
            padding:0;
            min-height:100%;
            font-family:Inter,Arial,sans-serif;
            background:
                radial-gradient(circle at top left, rgba(99,102,241,.35), transparent 35%),
                radial-gradient(circle at bottom right, rgba(139,92,246,.25), transparent 35%),
                linear-gradient(135deg,var(--bg1),var(--bg2));
            color:var(--text);
        }

        body{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:20px;
            overflow:hidden;
        }

        .blob{
            position:fixed;
            width:280px;
            height:280px;
            border-radius:50%;
            filter:blur(50px);
            opacity:.25;
            animation:float 8s ease-in-out infinite;
            pointer-events:none;
        }

        .blob.one{
            background:#6366f1;
            top:-60px;
            left:-50px;
        }

        .blob.two{
            background:#8b5cf6;
            right:-70px;
            bottom:-50px;
            animation-delay:1.2s;
        }

        @keyframes float{
            0%,100%{ transform:translateY(0) translateX(0); }
            50%{ transform:translateY(-16px) translateX(8px); }
        }

        .card{
            width:100%;
            max-width:420px;
            background:var(--card);
            border:1px solid var(--card-border);
            backdrop-filter:blur(16px);
            -webkit-backdrop-filter:blur(16px);
            border-radius:var(--radius);
            box-shadow:var(--shadow);
            padding:28px 22px;
            animation:fadeUp .45s ease;
        }

        @keyframes fadeUp{
            from{
                opacity:0;
                transform:translateY(18px) scale(.98);
            }
            to{
                opacity:1;
                transform:translateY(0) scale(1);
            }
        }

        .logo{
            width:64px;
            height:64px;
            margin:0 auto 16px;
            border-radius:18px;
            background:linear-gradient(135deg,var(--primary),var(--primary-2));
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:30px;
            box-shadow:0 12px 24px rgba(99,102,241,.35);
        }

        h1{
            margin:0 0 8px;
            font-size:1.6rem;
            text-align:center;
            letter-spacing:.2px;
        }

        .subtitle{
            margin:0 0 24px;
            text-align:center;
            color:var(--muted);
            font-size:.95rem;
            line-height:1.4;
        }

        form{
            display:flex;
            flex-direction:column;
            gap:14px;
        }

        .field{
            display:flex;
            flex-direction:column;
            gap:8px;
        }

        label{
            font-size:.92rem;
            color:var(--muted);
        }

        input[type="password"]{
            width:100%;
            padding:14px 14px;
            border-radius:14px;
            border:1px solid rgba(255,255,255,.16);
            background:rgba(255,255,255,.10);
            color:var(--text);
            outline:none;
            font-size:1rem;
            transition:.2s ease;
        }

        input[type="password"]::placeholder{
            color:rgba(255,255,255,.45);
        }

        input[type="password"]:focus{
            border-color:rgba(99,102,241,.7);
            box-shadow:0 0 0 4px rgba(99,102,241,.18);
            transform:translateY(-1px);
        }

        .button{
            margin-top:6px;
            border:none;
            border-radius:16px;
            padding:14px 16px;
            font-size:1rem;
            font-weight:700;
            color:white;
            background:linear-gradient(135deg,var(--primary),var(--primary-2));
            cursor:pointer;
            transition:transform .15s ease, box-shadow .2s ease, opacity .2s ease;
            box-shadow:0 14px 28px rgba(99,102,241,.30);
        }

        .button:hover{
            transform:translateY(-1px);
        }

        .button:active{
            transform:translateY(1px);
        }

        .error{
            margin-top:4px;
            padding:12px 14px;
            border-radius:14px;
            background:rgba(239,68,68,.15);
            border:1px solid rgba(239,68,68,.35);
            color:#fecaca;
            font-size:.94rem;
            animation:shake .24s linear;
        }

        @keyframes shake{
            0%,100%{ transform:translateX(0); }
            25%{ transform:translateX(-4px); }
            75%{ transform:translateX(4px); }
        }

        .footer{
            margin-top:18px;
            text-align:center;
            color:rgba(255,255,255,.55);
            font-size:.83rem;
        }

        @media (max-width:480px){
            .card{
                padding:24px 18px;
                border-radius:20px;
            }

            h1{
                font-size:1.4rem;
            }

            .subtitle{
                font-size:.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="blob one"></div>
    <div class="blob two"></div>

    <div class="card">
        <div class="logo">📚</div>
        <h1>Panel de administración</h1>
        <p class="subtitle">
            Acceso privado del club de lectura
        </p>

        <form method="post" action="/admin/login">
            <div class="field">
                <label for="secret">Secreto de administración</label>
                <input
                    id="secret"
                    name="secret"
                    type="password"
                    placeholder="Introduce el secreto"
                    autocomplete="current-password"
                    required
                >
            </div>

            {% if error %}
                <div class="error">{{ error }}</div>
            {% endif %}

            <button class="button" type="submit">Entrar</button>
        </form>

        <div class="footer">
            Club de lectura · acceso restringido
        </div>
    </div>
</body>
</html>
