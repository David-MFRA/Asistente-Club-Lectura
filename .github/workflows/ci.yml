name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile main.py db.py app/messages.py app/services/bot_context.py app/services/admin_guidance.py app/web/admin/insights.py app/web/admin/routes.py

      - name: Run tests
        run: python -m unittest discover -s tests
