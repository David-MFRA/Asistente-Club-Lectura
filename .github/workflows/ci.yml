name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Quality checks
        run: |
          python -m ruff check app/public_site.py app/services/public_site.py scripts/check_utf8.py
          python -m black --check app/public_site.py app/services/public_site.py scripts/check_utf8.py
          python scripts/check_utf8.py

      - name: Syntax check
        run: python -m py_compile main.py db.py app/admin_panel.py app/public_site.py app/services/public_site.py app/messages.py app/services/bot_context.py app/services/admin_guidance.py app/web/admin/insights.py app/web/admin/monitoring.py app/web/admin/routes.py app/web/admin/site.py scripts/check_utf8.py

      - name: Run tests
        run: python -m unittest discover -s tests
