<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso · Club de Lectura</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
    <style>
        :root{
            --bg1:#09111f;
            --bg2:#13223d;
            --card:rgba(255,255,255,.11);
            --card-border:rgba(255,255,255,.18);
            --text:#f8fafc;
            --muted:#cbd5e1;
            --primary:#0ea5a4;
            --primary2:#f59e0b;
            --danger:#ef4444;
            --shadow:0 20px 40px rgba(0,0,0,.28);
            --radius:24px;
            --font-display:"Georgia",serif;
            --font-body:"Segoe UI",sans-serif;
        }
        *{box-sizing:border-box}
        html,body{
            margin:0;
            min-height:100%;
            background:
                radial-gradient(circle at top left, rgba(14,165,164,.28), transparent 35%),
                radial-gradient(circle at bottom right, rgba(245,158,11,.22), transparent 38%),
                linear-gradient(135deg,var(--bg1),var(--bg2));
            color:var(--text);
            font-family:var(--font-body);
        }
        body{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:24px;
        }
        .card{
            width:100%;
            max-width:440px;
            background:var(--card);
            border:1px solid var(--card-border);
            backdrop-filter:blur(18px);
            border-radius:var(--radius);
            box-shadow:var(--shadow);
            padding:30px 24px;
        }
        .logo{
            width:68px;
            height:68px;
            margin:0 auto 16px;
            border-radius:20px;
            background:linear-gradient(135deg,var(--primary),var(--primary2));
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:32px;
            box-shadow:0 16px 28px rgba(14,165,164,.28);
        }
        h1{
            margin:0 0 8px;
            font-family:var(--font-display);
            font-size:1.8rem;
            text-align:center;
        }
        .subtitle{
            margin:0 0 24px;
            text-align:center;
            color:var(--muted);
            line-height:1.5;
        }
        form{
            display:flex;
            flex-direction:column;
            gap:14px;
        }
        .field{
            display:flex;
            flex-direction:column;
            gap:8px;
        }
        label{
            font-size:.92rem;
            color:var(--muted);
        }
        input[type="text"], input[type="password"]{
            width:100%;
            padding:14px;
            border-radius:14px;
            border:1px solid rgba(255,255,255,.18);
            background:rgba(255,255,255,.1);
            color:var(--text);
            outline:none;
            font-size:1rem;
            transition:.18s ease;
        }
        input[type="text"]::placeholder, input[type="password"]::placeholder{
            color:rgba(255,255,255,.45);
        }
        input[type="text"]:focus, input[type="password"]:focus{
            border-color:rgba(14,165,164,.9);
            box-shadow:0 0 0 4px rgba(14,165,164,.16);
            transform:translateY(-1px);
        }
        .button{
            margin-top:6px;
            border:none;
            border-radius:16px;
            padding:14px 16px;
            font-size:1rem;
            font-weight:700;
            color:#07211f;
            background:linear-gradient(135deg,var(--primary),var(--primary2));
            cursor:pointer;
            box-shadow:0 14px 28px rgba(14,165,164,.25);
            transition:transform .15s ease, box-shadow .2s ease;
        }
        .button:hover{
            transform:translateY(-1px);
            box-shadow:0 18px 34px rgba(14,165,164,.32);
        }
        .error{
            padding:12px 14px;
            border-radius:14px;
            background:rgba(239,68,68,.14);
            border:1px solid rgba(239,68,68,.35);
            color:#fecaca;
            font-size:.94rem;
        }
        .hint{
            margin-top:6px;
            color:rgba(255,255,255,.58);
            font-size:.8rem;
            line-height:1.5;
        }
        .footer{
            margin-top:18px;
            text-align:center;
            color:rgba(255,255,255,.55);
            font-size:.83rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">📚</div>
        <h1>Panel de administracion</h1>
        <p class="subtitle">Acceso privado del club. Si quieres que la auditoria identifique mejor tus cambios, indica un nombre corto.</p>

        <form method="post" action="/admin/login">
            <div class="field">
                <label for="display_name">Nombre para auditoria (opcional)</label>
                <input
                    id="display_name"
                    name="display_name"
                    type="text"
                    placeholder="Ej. David o Moderacion"
                    autocomplete="nickname"
                    value="{{ display_name or '' }}"
                >
            </div>

            <div class="field">
                <label for="secret">Secreto de administracion</label>
                <input
                    id="secret"
                    name="secret"
                    type="password"
                    placeholder="Introduce el secreto"
                    autocomplete="current-password"
                    required
                >
            </div>

            {% if error %}
                <div class="error">{{ error }}</div>
            {% endif %}

            <button class="button" type="submit">Entrar</button>
            <div class="hint">Tu IP y la ruta tambien quedaran registradas en la auditoria de acciones admin.</div>
        </form>

        <div class="footer">Club de lectura · acceso restringido</div>
    </div>
</body>
</html>
